[package]
name = "pyrt"
version = "1.0.0"
edition = "2021"
description = "Runtime support for Rust code generated by py2rs (Python printing, str methods, exceptions, stdlib)"
license = "MIT"
repository = "https://github.com/ccc-compiler/py2rs"
keywords = ["python", "runtime", "py2rs"]
categories = ["compilers"]

[dependencies]
indexmap = "2"
regex = { version = "1", optional = true }

[features]
# the `re` module
re = ["dep:regex"]
