[package]
name = "py2rs"
version = "1.0.0"
edition = "2021"
description = "Translate a typed subset of Python into readable Rust, with the same output as CPython or a clear error"
license = "MIT"
repository = "https://github.com/ccc-compiler/py2rs"
readme = "README.md"
keywords = ["python", "rust", "transpiler", "compiler", "ownership"]
categories = ["compilers", "development-tools"]
# the runtime is its own package; tests and benchmarks stay in the repository
include = ["src/**/*", "stubs/**/*", "python/**/*", "Cargo.toml", "README*.md", "SPEC*.md", "LICENSE"]

[dependencies]
pyrt = { path = "pyrt", version = "1.0.0", features = ["re"] }
ruff_python_parser = "0.0.20"
ruff_python_ast = "0.0.20"
ruff_text_size = "0.0.20"
ruff_source_file = "0.0.20"
serde_json = "1"
# checks `re` patterns at translation time (the same engine the program uses)
regex = "1"

[workspace]
members = [".", "pyrt"]
exclude = ["target"]
